<!doctype html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Mobile — Media Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --raised:#EDF1F6; --border:#D6DEE8;
  --text:#131A24; --muted:#5A6879;
  --amber:#B9791A; --teal:#12855F; --coral:#C33B2F; --violet:#5D4DC4; --steel:#2C6A9E;
  --c-axis:#5A6879; --c-grid:#C9D4E1; --c-label:#131A24;
  --c-teal:#12855F; --c-teal-d:#0C5F44;
  --c-coral:#C33B2F;
  --c-steel:#1F5B8A; --c-steel-l:#63A0CE;
  --c-amber:#B9791A;
  --c-violet:#5D4DC4;
  --c-slate:#64748B; --c-slate-d:#78899F;
  --shade:rgba(0,0,0,.05);
}
[data-theme="dark"]{
  --bg:#151A24; --panel:#1E2530; --raised:#262F3D; --border:#3B4759;
  --text:#EFF2F6; --muted:#9AA7BA;
  --amber:#E5A445; --teal:#4CBE93; --coral:#E8796C; --violet:#9B8CF0; --steel:#6E9FC9;
  --c-axis:#9AA7BA; --c-grid:#515F79; --c-label:#EFF2F6;
  --c-teal:#4CBE93; --c-teal-d:#2F7A5C;
  --c-coral:#E8796C;
  --c-steel:#4E87B8; --c-steel-l:#A9CDE8;
  --c-amber:#E5A445;
  --c-violet:#9B8CF0;
  --c-slate:#8795AB; --c-slate-d:#7B8AA0;
  --shade:rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.dp{font-family:'Space Grotesk',sans-serif}
.n{font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}

.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.brand{display:flex;gap:11px;align-items:center}
.bars{display:flex;align-items:flex-end;gap:3px;height:21px}
.bars span{width:5px;background:var(--amber);border-radius:1px;display:block}
.bars span:nth-child(1){height:7px}.bars span:nth-child(2){height:12px}
.bars span:nth-child(3){height:16px}.bars span:nth-child(4){height:21px}
.brand h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:8px;border:1px solid var(--border);flex-wrap:wrap}
.tb{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;
  font-weight:500;padding:8px 15px;border-radius:6px;cursor:pointer;transition:.15s}
.tb.active{background:var(--raised);color:var(--text)}
.tb:hover:not(.active):not(:disabled){color:var(--text)}
.theme-tog{margin-left:8px;border:1px solid var(--border);background:var(--panel);
  color:var(--muted);font-family:inherit;font-size:12px;font-weight:500;padding:8px 12px;
  border-radius:8px;cursor:pointer;transition:.15s}
.theme-tog:hover{color:var(--text)}
.view{display:none}.view.active{display:block}

.datebar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  font-size:12.5px;color:var(--muted);margin-bottom:18px}
.pill{background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:5px 11px;color:var(--text);font-size:12.5px}

.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;padding:22px 24px;margin-bottom:18px}
.hero .big{font-size:42px;font-weight:600;line-height:1}
.hero .big small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:7px}
.hero p{margin:0;max-width:60ch;font-size:13.5px;line-height:1.6;color:var(--muted)}
.hero p b{color:var(--text);font-weight:500}
.hero.warn{border-color:rgba(224,106,93,.4);background:linear-gradient(180deg,rgba(224,106,93,.07),transparent)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px 16px}
.kpi .lbl{font-size:11.5px;color:var(--muted);margin:0 0 7px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:600;margin:0;line-height:1}
.kpi .val.sm{font-size:21px}
.kpi .dl{font-size:11.5px;margin:7px 0 0}
.up{color:var(--teal)}.down{color:var(--coral)}.flat{color:var(--muted)}
.dl .pv{color:var(--muted)}

h2.sect{font-size:14.5px;font-weight:600;margin:26px 0 3px}
p.ss{font-size:12.5px;color:var(--muted);margin:0 0 13px;max-width:90ch;line-height:1.55}

table{width:100%;border-collapse:collapse;margin-bottom:6px}
thead th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);
  padding:0 9px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th.r,tbody td.r,thead th:not(:first-child),tbody td:not(:first-child){text-align:right}
tbody td{padding:9px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
tbody td:first-child{text-align:left}
tbody tr.tot td{font-weight:600;border-top:1px solid var(--border);border-bottom:none;
  background:var(--shade)}
td.stacked{white-space:normal}td.stacked .small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
.small{font-size:11px;color:var(--muted)}
.mini-bar{display:inline-block;width:64px;height:6px;background:var(--shade);border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:8px}
.mini-bar i{display:block;height:100%;background:var(--teal)}
.dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:7px;vertical-align:middle}
.tag{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:4px;margin-left:6px}
.tag.ok,.tag.conversion{background:rgba(76,190,147,.15);color:var(--teal)}
.tag.no{background:rgba(224,106,93,.15);color:var(--coral)}
.tag.na,.tag.offline{background:var(--shade);color:var(--muted)}
.tag.aw,.tag.awareness{background:rgba(229,164,69,.15);color:var(--amber)}
.tag.manual{background:rgba(93,77,196,.15);color:var(--violet)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.card h3{margin:0 0 3px;font-size:13.5px;font-weight:600}
.card .sub{margin:0 0 14px;font-size:12px;color:var(--muted);line-height:1.5}

.rr{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:12.5px}
.rr:last-child{border-bottom:none}
.rr .k{color:var(--muted)}
.rr .v{font-weight:600}
.rr.hl .v{color:var(--amber)}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.bar-row .nm{width:150px;flex-shrink:0}
.bar-row .track{flex:1;background:var(--shade);height:18px;border-radius:4px;overflow:hidden;position:relative}
.bar-row .fill{display:block;height:100%;border-radius:4px}
.bar-row .target-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.bar-row .fig{width:150px;text-align:right;flex-shrink:0;color:var(--muted)}
.bar-row .fig b{color:var(--text)}

svg.chart{width:100%;height:auto;display:block}
svg.chart rect{stroke:var(--panel);stroke-width:0.9}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}

.trend-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:860px){.trend-grid{grid-template-columns:1fr}}
.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.status-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 14px}
.status-card .sh{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.status-card .sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-card .sname{font-size:11.5px;font-weight:600;color:var(--text)}
